<header class="header" [class.scrolled]="isScrolled" role="banner">
  <!-- Cyan accent line ─ absolute top of page -->
  <div class="accent-line" aria-hidden="true"></div>

  <div class="header-inner" [@slideDown]>
    <!-- Logo Lumon (lâmpada + filamento em L) -->
    <a href="#" class="logo" aria-label="Lumon – Início">
      <svg
        width="34"
        height="50"
        viewBox="0 0 64 96"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <linearGradient id="lumonGlass" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#9DECF7"/>
            <stop offset="0.5" stop-color="#2EC6DE"/>
            <stop offset="1" stop-color="#15A0BC"/>
          </linearGradient>
          <linearGradient id="lumonFil" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F4E2AC"/>
            <stop offset="0.5" stop-color="#E9CE86"/>
            <stop offset="1" stop-color="#C99B3F"/>
          </linearGradient>
          <radialGradient id="lumonCore" cx="0.5" cy="0.42" r="0.62">
            <stop offset="0" stop-color="#C6F4FB" stop-opacity="0.95"/>
            <stop offset="0.55" stop-color="#2EC6DE" stop-opacity="0.28"/>
            <stop offset="1" stop-color="#2EC6DE" stop-opacity="0"/>
          </radialGradient>
          <filter id="lumonGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.7" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- inner glow (cyan + leve quente) -->
        <circle cx="32" cy="30" r="22" fill="url(#lumonCore)"/>
        <!-- glass bulb (cyan glow) -->
        <path
          d="M22 62 C22 56 18 53 14 48 C9 42 7 37 7 30 C7 17 18 7 32 7 C46 7 57 17 57 30 C57 37 55 42 50 48 C46 53 42 56 42 62 Z"
          fill="none" stroke="url(#lumonGlass)" stroke-width="3.4"
          stroke-linejoin="round" filter="url(#lumonGlow)"/>
        <!-- screw base -->
        <path d="M23 67 H41 M24 73 H40 M25 79 H39"
          stroke="url(#lumonGlass)" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M27 84 H37 L34 91 H30 Z" fill="url(#lumonGlass)"/>
        <!-- cursive L filament (dourado) -->
        <path
          d="M39 21 C31 22 26 30 29 39 C31 45 28 49 24 47 M27 45 C33 51 41 50 44 43"
          fill="none" stroke="url(#lumonFil)" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#lumonGlow)"/>
      </svg>
    </a>

    <!-- Navigation -->
    <nav class="nav" aria-label="Navegação principal">
      @for (link of navLinks; track link.label) {
        <a [href]="link.href" class="nav-link">{{ link.label }}</a>
      }

      <a
        href="#contato"
        class="cta-btn"
        role="button"
        aria-label="Solicitar orçamento grátis"
        [@ctaHover]="ctaHovered ? 'hovered' : 'default'"
        (mouseenter)="ctaHovered = true"
        (mouseleave)="ctaHovered = false"
      >ORÇAMENTO GRÁTIS</a>

      <!-- Hamburger (mobile only) -->
      <button
        type="button"
        class="menu-toggle"
        [class.open]="menuOpen"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'"
      >
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
      </button>
    </nav>
  </div>

  <!-- Mobile menu panel -->
  <nav
    class="mobile-menu"
    id="mobile-menu"
    [class.open]="menuOpen"
    aria-label="Navegação mobile"
  >
    @for (link of navLinks; track link.label) {
      <a [href]="link.href" class="mobile-link" (click)="closeMenu()">{{ link.label }}</a>
    }
    <a href="#contato" class="mobile-cta" (click)="closeMenu()">ORÇAMENTO GRÁTIS</a>
  </nav>
</header>
