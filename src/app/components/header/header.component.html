<header class="header" [class.scrolled]="isScrolled" role="banner">
  <!-- Cyan accent line ─ absolute top of page -->
  <div class="accent-line" aria-hidden="true"></div>

  <div class="header-inner" [@slideDown]>
    <!-- Logo Lumon (L + ponto) -->
    <a href="#" class="logo" aria-label="Lumon – Início">
      <svg
        width="32"
        height="46"
        viewBox="0 0 72 105"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <filter id="lumonDotGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="0" y="22" width="22" height="61" fill="currentColor"/>
        <rect x="0" y="83" width="72" height="22" fill="currentColor"/>
        <circle cx="11" cy="11" r="11" fill="#07ACDE" filter="url(#lumonDotGlow)"/>
      </svg>
    </a>

    <!-- Navigation -->
    <nav class="nav" aria-label="Navegação principal">
      @for (link of navLinks; track link.label) {
        <a [href]="link.href" class="nav-link">{{ link.label }}</a>
      }

      <a
        href="#contato"
        class="cta-btn"
        role="button"
        aria-label="Solicitar orçamento grátis"
        [@ctaHover]="ctaHovered ? 'hovered' : 'default'"
        (mouseenter)="ctaHovered = true"
        (mouseleave)="ctaHovered = false"
      >ORÇAMENTO GRÁTIS</a>
    </nav>
  </div>
</header>
